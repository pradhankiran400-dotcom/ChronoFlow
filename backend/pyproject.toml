[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "chronoflow-backend"
version = "1.0.0"
description = "ChronoFlow Backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "sqlalchemy>=2.0.0",
    "pg8000>=1.31.0",
    "psycopg2-binary>=2.9.9",
    "mangum>=0.17.0",
    "python-dotenv>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.31.0",
    "pydantic>=2.6.0",
    "email-validator>=2.1.0",
    "numpy>=1.24.0",
    "groq>=0.9.0"
]
